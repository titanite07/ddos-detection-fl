# Docker Compose for Complete FL-DDoS Detection System
# Real-time deployment with blockchain, FL nodes, and dashboard

version: '3.8'

networks:
  fl_network:
    name: fl_ddos_network
    driver: bridge

volumes:
  blockchain_data:
  models_data:
  logs_data:
  orderer.fl-ddos.com:
  peer0.client1.fl-ddos.com:
  peer0.client2.fl-ddos.com:
  peer0.client3.fl-ddos.com:

services:
  
  # ===== BLOCKCHAIN LAYER (Hyperledger Fabric) =====
  
  orderer.fl-ddos.com:
    container_name: orderer.fl-ddos.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./fabric/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./fabric/crypto-config/ordererOrganizations/fl-ddos.com/orderers/orderer.fl-ddos.com/msp:/var/hyperledger/orderer/msp
      - orderer.fl-ddos.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
    networks:
      - fl_network

  peer0.client1.fl-ddos.com:
    container_name: peer0.client1.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_ddos_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.client1.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_LOCALMSPID=Client1MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/crypto-config/peerOrganizations/client1.fl-ddos.com/peers/peer0.client1.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client1.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  peer0.client2.fl-ddos.com:
    container_name: peer0.client2.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_ddos_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_ID=peer0.client2.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client2.fl-ddos.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_LOCALMSPID=Client2MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/crypto-config/peerOrganizations/client2.fl-ddos.com/peers/peer0.client2.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client2.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 8051:8051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  peer0.client3.fl-ddos.com:
    container_name: peer0.client3.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_ddos_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_ID=peer0.client3.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client3.fl-ddos.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_LOCALMSPID=Client3MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/crypto-config/peerOrganizations/client3.fl-ddos.com/peers/peer0.client3.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client3.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  # ==== APPLICATION LAYER =====

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_ddos_dashboard
    command: python -m ddosdfl.projects.dashboard.app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    env_file:
      - .env
    volumes:
      - ./ddosdfl:/app/ddosdfl
      - ./models:/app/models
      - logs_data:/app/logs
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com
      - peer0.client1.fl-ddos.com
    restart: unless-stopped

  fl_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_aggregation_server
    command: python -m ddosdfl.projects.fl.aggregation_server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FL_ROUNDS=${FL_ROUNDS:-20}
      - BATCH_SIZE=${BATCH_SIZE:-32}
    env_file:
      - .env
    volumes:
      - ./ddosdfl:/app/ddosdfl
      - ./models:/app/models
      - logs_data:/app/logs
    networks:
      - fl_network
    depends_on:
      - dashboard
    restart: unless-stopped

  fl_node_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_node_1
    command: python -m ddosdfl.projects.fl.fl_node_client
    # IMPORTANT: For real-time packet capture
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - NODE_ID=node_1
      - NODE_INTERFACE=eth0 
      - FL_SERVER_URL=http://localhost:8000
    env_file:
      - .env
    volumes:
      - ./ddosdfl:/app/ddosdfl
      - ./models:/app/models
      - logs_data:/app/logs
    depends_on:
      - fl_server
    restart: unless-stopped

  fl_node_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_node_2
    command: python -m ddosdfl.projects.fl.fl_node_client
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - NODE_ID=node_2
      - NODE_INTERFACE=wlan0
      - FL_SERVER_URL=http://localhost:8000
    env_file:
      - .env
    volumes:
      - ./ddosdfl:/app/ddosdfl
      - ./models:/app/models
      - logs_data:/app/logs
    depends_on:
      - fl_server
    restart: unless-stopped

  realtime_detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime_ddos_detector
    command: python -m ddosdfl.tests.test_realtime_detection
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CAPTURE_INTERFACE=eth0
      - MODEL_PATH=/app/models/best_model.keras
    env_file:
      - .env
    volumes:
      - ./ddosdfl:/app/ddosdfl
      - ./models:/app/models
      - ./data:/app/data
      - logs_data:/app/logs
    depends_on:
      - dashboard
    restart: unless-stopped

  # ===== OPTIONAL: Monitoring =====
  
  portainer:
    image: portainer/portainer-ce:latest
    container_name: fl_ddos_portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - fl_network
    restart: unless-stopped

volumes:
  portainer_data:
