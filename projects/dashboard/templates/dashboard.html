<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FL-DDoS Monitoring Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .status-bar {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
      }

      .metric {
        text-align: center;
        padding: 10px 20px;
      }

      .metric-value {
        font-size: 2em;
        font-weight: bold;
        margin: 5px 0;
      }

      .metric-label {
        font-size: 0.9em;
        opacity: 0.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
      }

      .card h2 {
        margin-bottom: 15px;
        font-size: 1.3em;
      }

      .node {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 10px;
      }

      .node-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .node-status {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.85em;
      }

      .status-active {
        background: #4caf50;
      }

      .status-suspicious {
        background: #ff9800;
      }

      .status-removed {
        background: #f44336;
      }

      .progress-bar {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        height: 8px;
        margin-top: 10px;
        overflow: hidden;
      }

      .progress-fill {
        background: #4caf50;
        height: 100%;
        transition: width 0.5s ease;
      }

      .controls {
        text-align: center;
        margin: 20px 0;
      }

      button {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid #fff;
        color: #fff;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 1.1em;
        cursor: pointer;
        margin: 0 10px;
        transition: all 0.3s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .alert {
        background: #f44336;
        border-radius: 10px;
        padding: 15px;
        margin: 10px 0;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🛡️ FL-DDoS Monitoring Dashboard</h1>
        <p>Real-time Federated Learning System Monitor</p>
      </div>

      <div class="status-bar">
        <div class="metric">
          <div class="metric-label">Current Round</div>
          <div class="metric-value" id="current-round">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Accuracy</div>
          <div class="metric-value" id="accuracy">0.00%</div>
        </div>
        <div class="metric">
          <div class="metric-label">Loss</div>
          <div class="metric-value" id="loss">0.00</div>
        </div>
        <div class="metric">
          <div class="metric-label">Active Nodes</div>
          <div class="metric-value" id="active-nodes">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Attacks Detected</div>
          <div class="metric-value" id="attacks">0</div>
        </div>
      </div>

      <div class="controls">
        <button onclick="startTraining()">▶️ Start Training</button>
        <button onclick="stopTraining()">⏸️ Stop Training</button>
      </div>

      <div class="grid">
        <div class="card">
          <h2>📊 Training Progress</h2>
          <canvas id="accuracyChart"></canvas>
        </div>

        <div class="card">
          <h2>🖥️ Node Status</h2>
          <div id="nodes-container"></div>
        </div>
      </div>

      <div id="alerts-container"></div>
    </div>

    <script>
      const socket = io();

      // Chart setup
      const ctx = document.getElementById("accuracyChart").getContext("2d");
      const accuracyChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Accuracy",
              data: [],
              borderColor: "#4CAF50",
              backgroundColor: "rgba(76, 175, 80, 0.1)",
              tension: 0.4,
            },
            {
              label: "Loss",
              data: [],
              borderColor: "#f44336",
              backgroundColor: "rgba(244, 67, 54, 0.1)",
              tension: 0.4,
              yAxisID: "y1",
            },
          ],
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false,
          },
          scales: {
            y: {
              type: "linear",
              display: true,
              position: "left",
              ticks: { color: "#fff" },
              grid: { color: "rgba(255,255,255,0.1)" },
            },
            y1: {
              type: "linear",
              display: true,
              position: "right",
              ticks: { color: "#fff" },
              grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.1)" },
            },
            x: {
              ticks: { color: "#fff" },
              grid: { color: "rgba(255,255,255,0.1)" },
            },
          },
          plugins: {
            legend: {
              labels: { color: "#fff" },
            },
          },
        },
      });

      // Socket event handlers
      socket.on("connect", function () {
        console.log("Connected to dashboard");
      });

      socket.on("fl_update", function (data) {
        updateDashboard(data);
      });

      socket.on("training_complete", function (data) {
        alert(data.message);
      });

      function updateDashboard(data) {
        // Update metrics
        document.getElementById("current-round").textContent =
          data.current_round + "/" + data.total_rounds;
        document.getElementById("accuracy").textContent =
          (data.accuracy * 100).toFixed(2) + "%";
        document.getElementById("loss").textContent = data.loss.toFixed(4);

        // Count active nodes
        const activeCount = Object.values(data.nodes).filter(
          (n) => n.status === "active"
        ).length;
        document.getElementById("active-nodes").textContent = activeCount;
        document.getElementById("attacks").textContent = data.attacks_detected;

        // Update chart
        if (data.history && data.history.length > 0) {
          accuracyChart.data.labels = data.history.map((h) => "R" + h.round);
          accuracyChart.data.datasets[0].data = data.history.map(
            (h) => h.accuracy
          );
          accuracyChart.data.datasets[1].data = data.history.map((h) => h.loss);
          accuracyChart.update();
        }

        // Update nodes
        updateNodes(data.nodes);

        // Show alerts for attacks
        if (data.attacks_detected > 0 && !document.querySelector(".alert")) {
          showAlert("⚠️ Byzantine node detected and removed!");
        }
      }

      function updateNodes(nodes) {
        const container = document.getElementById("nodes-container");
        container.innerHTML = "";

        for (const [nodeId, node] of Object.entries(nodes)) {
          const nodeDiv = document.createElement("div");
          nodeDiv.className = "node";
          nodeDiv.innerHTML = `
                    <div class="node-header">
                        <strong>${nodeId}</strong>
                        <span class="node-status status-${node.status}">${
            node.status
          }</span>
                    </div>
                    <div>Trust: ${(node.trust_score * 100).toFixed(1)}%</div>
                    <div>Samples: ${node.samples.toLocaleString()}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${
                          node.trust_score * 100
                        }%"></div>
                    </div>
                `;
          container.appendChild(nodeDiv);
        }
      }

      function startTraining() {
        fetch("/api/start_training")
          .then((r) => r.json())
          .then((data) => {
            console.log("Training started");
          });
      }

      function stopTraining() {
        fetch("/api/stop_training")
          .then((r) => r.json())
          .then((data) => {
            console.log("Training stopped");
          });
      }

      function showAlert(message) {
        const container = document.getElementById("alerts-container");
        const alert = document.createElement("div");
        alert.className = "alert";
        alert.textContent = message;
        container.appendChild(alert);

        setTimeout(() => alert.remove(), 5000);
      }
    </script>
  </body>
</html>
