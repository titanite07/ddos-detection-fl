
volumes:
  orderer.fl-ddos.com:
  peer0.client1.fl-ddos.com:
  peer0.client2.fl-ddos.com:
  peer0.client3.fl-ddos.com:

networks:
  fl_network:
    name: fl_blockchain_network

services:
  orderer.fl-ddos.com:
    container_name: orderer.fl-ddos.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # TLS
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/fl-ddos.com/orderers/orderer.fl-ddos.com/msp:/var/hyperledger/orderer/msp
      - orderer.fl-ddos.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
    networks:
      - fl_network

  peer0.client1.fl-ddos.com:
    container_name: peer0.client1.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_blockchain_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.client1.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.client1.fl-ddos.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_LOCALMSPID=Client1MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/client1.fl-ddos.com/peers/peer0.client1.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client1.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  peer0.client2.fl-ddos.com:
    container_name: peer0.client2.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_blockchain_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.client2.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client2.fl-ddos.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.client2.fl-ddos.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.client2.fl-ddos.com:8051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.client2.fl-ddos.com:8051
      - CORE_PEER_LOCALMSPID=Client2MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/client2.fl-ddos.com/peers/peer0.client2.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client2.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 8051:8051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  peer0.client3.fl-ddos.com:
    container_name: peer0.client3.fl-ddos.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fl_blockchain_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.client3.fl-ddos.com
      - CORE_PEER_ADDRESS=peer0.client3.fl-ddos.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.client3.fl-ddos.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.client3.fl-ddos.com:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.client3.fl-ddos.com:9051
      - CORE_PEER_LOCALMSPID=Client3MSP
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/client3.fl-ddos.com/peers/peer0.client3.fl-ddos.com/msp:/etc/hyperledger/fabric/msp
      - peer0.client3.fl-ddos.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
    networks:
      - fl_network
    depends_on:
      - orderer.fl-ddos.com

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.client1.fl-ddos.com:7051
      - CORE_PEER_LOCALMSPID=Client1MSP
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/client1.fl-ddos.com/users/Admin@client1.fl-ddos.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ./chaincode/:/opt/gopath/src/github.com/chaincode
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
    depends_on:
      - orderer.fl-ddos.com
      - peer0.client1.fl-ddos.com
      - peer0.client2.fl-ddos.com
      - peer0.client3.fl-ddos.com
    networks:
      - fl_network
